[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ans2py"
version = "0.1.0"
description = "Convert IBM APL2 .ANS workspace files to Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ans2py contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
keywords = ["apl", "ibm", "converter", "transpiler", "numpy"]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ans2py = "ans2py.cli:main"

[project.urls]
Homepage = "https://github.com/user/ans2py"
Issues = "https://github.com/user/ans2py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ans2py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
